# Render Blueprint for RepoRadar API.
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Secrets (sync:false) are entered in the Render dashboard, NOT committed to git.
services:
  - type: web
    name: reporadar-api
    runtime: node
    rootDir: api
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://bannawat.site
      # --- secrets: set these in the Render dashboard (Environment tab) ---
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_FORWARD_TOKEN
        sync: false
