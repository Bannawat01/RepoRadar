<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d2e"/>
      <stop offset="1" stop-color="#111726"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ba1ff"/>
      <stop offset="0.5" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#5865F2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b86"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ff5c7a"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="18" fill="none" stroke="#1e2740"/>

  <!-- Title -->
  <text x="48" y="62" fill="#e8edf7" font-size="30" font-weight="700">RepoRadar</text>
  <text x="196" y="62" fill="#7f8db0" font-size="18" font-weight="500">— Real-Time DevOps Monitoring Pipeline</text>
  <text x="48" y="90" fill="#5b6b86" font-size="14" letter-spacing="1.5">TypeScript · Fastify · n8n · Discord</text>

  <!-- ===== Stage cards ===== -->
  <!-- helper geometry: y=150 h=150 w=232 -->
  <!-- 1. GitHub -->
  <g>
    <rect x="40" y="150" width="232" height="150" rx="14" fill="url(#card)" stroke="#26314d"/>
    <rect x="40" y="150" width="232" height="4" rx="2" fill="#e8edf7"/>
    <circle cx="72" cy="192" r="15" fill="none" stroke="#e8edf7" stroke-width="2"/>
    <circle cx="72" cy="192" r="5" fill="#e8edf7"/>
    <text x="100" y="190" fill="#e8edf7" font-size="19" font-weight="700">GitHub</text>
    <text x="100" y="212" fill="#7f8db0" font-size="13">Webhook events</text>
    <text x="64" y="252" fill="#9aa7c7" font-size="12.5" font-family="monospace">push · pull_request</text>
    <text x="64" y="272" fill="#9aa7c7" font-size="12.5" font-family="monospace">issues · ping</text>
  </g>

  <!-- 2. Fastify API -->
  <g>
    <rect x="332" y="150" width="232" height="150" rx="14" fill="url(#card)" stroke="#26314d"/>
    <rect x="332" y="150" width="232" height="4" rx="2" fill="#2ee6a6"/>
    <circle cx="364" cy="192" r="15" fill="#0f2a22" stroke="#2ee6a6" stroke-width="2"/>
    <path d="M357,192 h14 M364,185 v14" stroke="#2ee6a6" stroke-width="2" stroke-linecap="round"/>
    <text x="392" y="190" fill="#e8edf7" font-size="19" font-weight="700">Fastify API</text>
    <text x="392" y="212" fill="#7f8db0" font-size="13">Security &amp; normalize</text>
    <g font-size="11.5" font-family="monospace">
      <rect x="356" y="234" width="86" height="22" rx="6" fill="#132033" stroke="#2a3a58"/>
      <text x="366" y="249" fill="#8fd8c0">HMAC-256</text>
      <rect x="450" y="234" width="58" height="22" rx="6" fill="#132033" stroke="#2a3a58"/>
      <text x="460" y="249" fill="#8fd8c0">Zod</text>
      <rect x="356" y="264" width="152" height="22" rx="6" fill="#132033" stroke="#2a3a58"/>
      <text x="366" y="279" fill="#8fb4e6">Idempotency (delivery-id)</text>
    </g>
  </g>

  <!-- 3. n8n -->
  <g>
    <rect x="624" y="150" width="232" height="150" rx="14" fill="url(#card)" stroke="#26314d"/>
    <rect x="624" y="150" width="232" height="4" rx="2" fill="#ff5c7a"/>
    <circle cx="656" cy="186" r="6" fill="#ff5c7a"/>
    <circle cx="656" cy="206" r="6" fill="#ff5c7a"/>
    <circle cx="682" cy="196" r="6" fill="#ff8aa0"/>
    <path d="M662,186 L676,196 M662,206 L676,196" stroke="#ff5c7a" stroke-width="2"/>
    <text x="702" y="190" fill="#e8edf7" font-size="19" font-weight="700">n8n</text>
    <text x="702" y="212" fill="#7f8db0" font-size="13">Route &amp; present</text>
    <g font-size="11.5" font-family="monospace">
      <rect x="648" y="234" width="94" height="22" rx="6" fill="#241624" stroke="#5a2a3c"/>
      <text x="658" y="249" fill="#ffa9bc">Token guard</text>
      <rect x="750" y="234" width="86" height="22" rx="6" fill="#241624" stroke="#5a2a3c"/>
      <text x="760" y="249" fill="#ffa9bc">Switch</text>
      <rect x="648" y="264" width="188" height="22" rx="6" fill="#241624" stroke="#5a2a3c"/>
      <text x="658" y="279" fill="#ffa9bc">Rich-embed builders (3)</text>
    </g>
  </g>

  <!-- 4. Discord -->
  <g>
    <rect x="916" y="150" width="232" height="150" rx="14" fill="url(#card)" stroke="#26314d"/>
    <rect x="916" y="150" width="232" height="4" rx="2" fill="#5865F2"/>
    <ellipse cx="950" cy="194" rx="16" ry="12" fill="none" stroke="#8f9bff" stroke-width="2"/>
    <circle cx="944" cy="194" r="2.6" fill="#8f9bff"/>
    <circle cx="956" cy="194" r="2.6" fill="#8f9bff"/>
    <text x="980" y="190" fill="#e8edf7" font-size="19" font-weight="700">Discord</text>
    <text x="980" y="212" fill="#7f8db0" font-size="13">Live notifications</text>
    <g font-size="11.5" font-family="monospace">
      <rect x="940" y="234" width="66" height="22" rx="6" fill="#1a1e33" stroke="#33407a"/>
      <text x="950" y="249" fill="#aab4ff">merged</text>
      <rect x="1014" y="234" width="58" height="22" rx="6" fill="#1a1e33" stroke="#33407a"/>
      <text x="1024" y="249" fill="#aab4ff">closed</text>
      <rect x="1082" y="234" width="52" height="22" rx="6" fill="#1a1e33" stroke="#33407a"/>
      <text x="1092" y="249" fill="#aab4ff">issue</text>
    </g>
  </g>

  <!-- ===== Flow arrows ===== -->
  <g stroke-width="2.5" fill="none">
    <line x1="272" y1="225" x2="330" y2="225" stroke="url(#flow)" marker-end="url(#arrow)"/>
    <line x1="564" y1="225" x2="622" y2="225" stroke="url(#flow)" marker-end="url(#arrow)"/>
    <line x1="856" y1="225" x2="914" y2="225" stroke="url(#flow)" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" font-family="monospace" fill="#6f7ea0" text-anchor="middle">
    <text x="301" y="216">HMAC</text>
    <text x="593" y="216">normalized</text>
    <text x="885" y="216">embed</text>
  </g>

  <!-- ===== Resilience band ===== -->
  <g>
    <rect x="40" y="342" width="536" height="170" rx="14" fill="#0f1626" stroke="#22304d"/>
    <text x="64" y="374" fill="#8fb4e6" font-size="15" font-weight="700">◆ Idempotency layer</text>
    <text x="64" y="400" fill="#9aa7c7" font-size="13">Every X-GitHub-Delivery ID is tracked. Duplicate</text>
    <text x="64" y="420" fill="#9aa7c7" font-size="13">redeliveries are ignored — and an event is marked</text>
    <text x="64" y="440" fill="#9aa7c7" font-size="13">&quot;seen&quot; only <tspan fill="#e8edf7" font-weight="600">after</tspan> downstream delivery succeeds.</text>
    <text x="64" y="476" fill="#6f7ea0" font-size="12" font-family="monospace">→ no duplicates · no dropped events</text>
  </g>

  <g>
    <rect x="612" y="342" width="536" height="170" rx="14" fill="#0f1626" stroke="#22304d"/>
    <text x="636" y="374" fill="#ffa9bc" font-size="15" font-weight="700">◆ Two-tier Discord resilience</text>
    <text x="636" y="400" fill="#9aa7c7" font-size="13"><tspan fill="#e8edf7" font-weight="600">Tier 1</tspan> — native retry: 5 tries · backoff, absorbs</text>
    <text x="636" y="420" fill="#9aa7c7" font-size="13">429 rate-limits &amp; 5xx blips automatically.</text>
    <text x="636" y="444" fill="#9aa7c7" font-size="13"><tspan fill="#e8edf7" font-weight="600">Tier 2</tspan> — on exhaustion: log + 502 → GitHub redelivers.</text>
    <text x="636" y="476" fill="#6f7ea0" font-size="12" font-family="monospace">→ at-least-once delivery guarantee</text>
  </g>

  <!-- feedback loop arrow: Discord/n8n failure -> GitHub redeliver -->
  <path d="M1030,150 C1030,116 150,116 156,150" fill="none" stroke="#ff5c7a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <text x="593" y="112" fill="#ff8aa0" font-size="12" font-family="monospace" text-anchor="middle">non-2xx  →  redeliver (fault-tolerant loop)</text>
</svg>
